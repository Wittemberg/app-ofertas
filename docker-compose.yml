version: '3.8'
services:
  app:
    image: ghcr.io/wittemberg/app-ofertas:latest
    networks:
      - interna
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.app-ofertas.rule=HostRegexp(`{host:.+}`)"
        - "traefik.http.routers.app-ofertas.priority=1"
        - "traefik.http.services.app-ofertas.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 4
networks:
  interna:
    external: true